[package]
name = "radarclip-wasm"
description = "radarclip in the browser: parse a CS2 demo locally and cut radarclip/1 clips"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
radarclip-core.workspace = true
radarclip-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"

# The parser's dependencies pull in three getrandom versions; on wasm32 each needs its JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
