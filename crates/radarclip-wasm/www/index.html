<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radarclip parser test</title>
<style>
  :root { --bg: #fff; --fg: #1b1d21; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #e8eaed; --muted: #9aa0a6; --line: #2a2e35; --accent: #6ea0ff; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  label.drop { display: block; border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; }
  label.drop.over { border-color: var(--accent); }
  input[type=file] { display: none; }
  #status { margin: 16px 0; font-variant-numeric: tabular-nums; }
  progress { width: 100%; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  button { font: inherit; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #out a { color: var(--accent); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>radarclip parser test</h1>
  <p class="lead">Drop a CS2 demo (.dem, .dem.bz2, .dem.zst). It is parsed in this tab with WebAssembly; nothing is uploaded.</p>
  <label class="drop" id="drop">Drop a demo here or click to choose<input type="file" id="file" accept=".dem,.bz2,.zst"></label>
  <div id="status" class="muted"></div>
  <div id="out"></div>
  <table id="rounds" hidden><thead><tr><th>Round</th><th>Length</th><th>Winner</th><th></th></tr></thead><tbody></tbody></table>
</main>
<script type="module">
const worker = new Worker('./worker.js', { type: 'module' });
const $ = id => document.getElementById(id);
const status = $('status'), out = $('out'), tbody = document.querySelector('#rounds tbody');
const mb = n => (n / 1e6).toFixed(0) + ' MB';
let name = 'demo';

function open(file) {
  name = file.name.replace(/\.dem(\.\w+)?$/, '');
  status.innerHTML = `<progress max="${file.size}" value="0"></progress>`;
  out.textContent = '';
  $('rounds').hidden = true;
  worker.postMessage({ type: 'open', file });
}
$('file').onchange = e => e.target.files[0] && open(e.target.files[0]);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && open(e.dataTransfer.files[0]); };

async function deflated(text) {
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return new Blob([await new Response(stream).arrayBuffer()], { type: 'application/vnd.radarclip' });
}

worker.onmessage = async ({ data }) => {
  if (data.type === 'progress') {
    const p = status.querySelector('progress');
    if (p) p.value = data.loaded;
    if (data.loaded === data.size) status.innerHTML += ' <span>parsing…</span>';
  } else if (data.type === 'info') {
    const { info } = data;
    status.textContent = `${info.map} · ${info.rounds.length} rounds · ${info.players.length} players — read ${(data.readMs / 1e3).toFixed(1)} s, parsed ${(data.parseMs / 1e3).toFixed(1)} s`;
    tbody.innerHTML = info.rounds.map(r => `<tr><td>R${r.number}</td><td>${r.seconds.toFixed(0)} s</td><td>${r.winner ?? '?'}</td>
      <td><button data-r="${r.number}" data-to="20">0–20 s</button> <button data-r="${r.number}">full round</button></td></tr>`).join('');
    $('rounds').hidden = false;
  } else if (data.type === 'clip') {
    const blob = await deflated(data.json);
    const r = data.request;
    const file = `${name}-r${r.round}${r.to ? `-${r.from}-${r.to}` : ''}.radarclip`;
    out.innerHTML = `R${r.round}: ${data.json.length.toLocaleString()} B JSON → <b>${blob.size.toLocaleString()} B</b> deflated (cut in ${data.ms.toFixed(0)} ms) ·
      <a download="${file}" href="${URL.createObjectURL(blob)}">${file}</a> ·
      <a download="${file}.json" href="${URL.createObjectURL(new Blob([data.json], { type: 'application/json' }))}">JSON</a>`;
  } else if (data.type === 'error') {
    status.textContent = 'Error: ' + data.message;
  }
};
tbody.onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  const request = { round: +b.dataset.r, anonymize: true };
  if (b.dataset.to) Object.assign(request, { from: 0, to: +b.dataset.to });
  worker.postMessage({ type: 'clip', request });
};
</script>
</body>
</html>
