[package]
name = "radarclip-parser"
description = "Read a CS2 demo once and cut radarclip/1 clips out of it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
radarclip-core.workspace = true
parser.workspace = true
ahash.workspace = true
# Pure-Rust decoders, so .dem.bz2 / .dem.zst also work in the browser.
bzip2 = "0.6"  # default backend: libbz2-rs-sys (pure Rust)
ruzstd = "0.9"
