[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/radarclip/radarclip"

[workspace.dependencies]
radarclip-core = { path = "crates/radarclip-core" }
radarclip-parser = { path = "crates/radarclip-parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# demoparser2's parser crate from our fork (branch `radarclip`: wasm32 and protoc fixes).
parser = { git = "https://github.com/radarclip/demoparser", rev = "126f080c6e82079fab75b8483188439e85657250" }
ahash = "0.8"

[profile.release]
lto = true
codegen-units = 1
